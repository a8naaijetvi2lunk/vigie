[package]
name = "vigie"
version = "0.2.2"
description = "Widget Windows de suivi des quotas Claude Code et Codex"
authors = ["a8naaijetvi2lunk"]
license = "MIT"
repository = "https://github.com/a8naaijetvi2lunk/vigie"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vigie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
walkdir = "2"
ureq = { version = "2", features = ["json"] }
winreg = "0.55"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
